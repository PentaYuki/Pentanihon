name: Daily NihonGo Study & Story Automation

on:
  schedule:
    # Tự động chạy mỗi ngày lúc 00:00 UTC (tức 07:00 sáng giờ Việt Nam)
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công bằng 1 nút bấm trên GitHub

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate New Daily Story & Update Dashboard
        run: |
          python scripts/generate_daily_story.py
          python scripts/daily_study_scheduler.py

      - name: Commit and Push New Daily Story
        run: |
          git config --global user.name "PentaYuki Bot"
          git config --global user.email "bot@pentanihon.local"
          git add story/
          if git diff --staged --quiet; then
            echo "No new story generated today."
          else
            git commit -m "feat(daily-story): tự động xuất bản câu chuyện Nhật ngữ mới [skip ci]"
            git push origin main
          fi
