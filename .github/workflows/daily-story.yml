name: Daily NihonGo Study & Story Runner

on:
  schedule:
    # Chạy mỗi ngày lúc 00:00 UTC (07:00 sáng giờ Việt Nam)
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công bằng 1 click trên GitHub

jobs:
  daily-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily Study Scheduler
        run: |
          python scripts/daily_study_scheduler.py
